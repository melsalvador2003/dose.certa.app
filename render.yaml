services:
  - type: web
    name: dose-certa-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd .. && uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
